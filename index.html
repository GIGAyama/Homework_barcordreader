<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!--
      「ホーム画面に追加」の案内を出すための仕掛け。
      Chrome の beforeinstallprompt は React の起動より前に飛んでくることがあり、
      受け取り手がいないと捨てられて二度と来ない。だから <head> のいちばん上に置く。
    -->
    <script src="./install-hook.js"></script>
    <!--
      Content-Security-Policy

      connect-src だけ https: と広めにしている。理由は、先生が自分で立てた
      AI プロキシ（Cloud Run など）の URL を画面から入力して使う作りだから。
      URL は学校ごとに違うので、あらかじめ列挙できない。
      代わりに http: / data: / ws: は許可しないこと、アプリ側でも
      validateProxyUrl() が HTTPS 以外を弾くことで守る。

      script-src に accounts.google.com があるのは、Google ドライブ連携で
      Google のログイン用スクリプト（gsi/client）を読み込むため。
      style-src の 'unsafe-inline' は、画面内で <style> を書き出している箇所と
      style 属性のため。
    -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' https://accounts.google.com;
      style-src 'self' 'unsafe-inline';
      font-src 'self';
      img-src 'self' data: blob:;
      connect-src 'self' https:;
      frame-src https://accounts.google.com;
      worker-src 'self';
      manifest-src 'self';
      object-src 'none';
      base-uri 'self';
      form-action 'self';
    " />
    <!--
      frame-ancestors はここには書けない。<meta> で配ると無視され、
      読み込みのたびに警告がコンソールに出るだけになる（実測で確認した）。
      他サイトへの埋め込みを止めるには HTTP ヘッダーが要るが、
      GitHub Pages ではヘッダーを足せない。独自ドメインや CDN を挟むときに設定すること。
    -->
    <!--
      viewport-fit=cover は、iPad や画面に切り欠きのある端末で
      安全領域（env(safe-area-inset-*)）を CSS から使えるようにするために要る。
      maximum-scale や user-scalable は指定しない。指定すると児童が
      拡大できなくなり、見えづらい子が使えなくなる。
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="宿題の提出確認と朝の健康観察（きもちメーター）を一瞬で完了できる教室用アプリ" />
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="GIGA school">
    <meta property="og:locale" content="ja_JP">
    <meta property="og:title" content="宿題ポスト">
    <meta property="og:description" content="宿題の提出確認と朝の健康観察（きもちメーター）を一瞬で完了できる教室用アプリ">
    <meta property="og:url" content="https://homework-barcordreader.giga-school.com/">
    <meta property="og:image" content="https://giga-school.com/assets/og.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="GIGA school｜学校で使える Web アプリ">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="theme-color" content="#ef4444" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="./favicon.png" />
    <!--
      apple-touch-icon は透明を持たない専用画像を指す。
      角丸の外が透明な画像を指定すると、iPad のホーム画面で四隅が黒く出る。
    -->
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
  <!-- 書体は自分のところから配る（生成物。node tools/fonts/build-fonts.mjs で作り直す）。
       ここに Google Fonts への link を戻さないこと。学校のフィルタが
       塞ぐと書体が当たらず、塞ぎ方によっては画面そのものが出ない。 -->
  <link rel="stylesheet" href="./fonts.css" />
    <title>宿題ポスト</title>
  </head>
  <body>
    <div id="root"></div>

    <!-- 利用規約・プライバシーへの行き先。中身は正本の部品
         standards/web/giga-app-links.js（配布物 public/giga-app-links.js）が、
         src/App.jsx のフッターに置いた <span data-giga-links> の中に出す。

         ⚠️ あのフッターは {view !== 'admin' && <Footer />} で、先生の画面へ
            切り替えると置き場所ごと消える。部品はそれを見て出しなおす
            （正本の watchForSlot を参照）。2026-08-29 にそこを直した。

         ⚠️ data-links は置き場所の側（App.jsx）に書いてある。まだ
            docs/manual/ が無いので「つかいかた」を外してある。 -->
    <script src="/giga-app-links.js" defer></script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
